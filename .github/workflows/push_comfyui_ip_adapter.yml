name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'comfyui_ip_adapter/**'
      - '.github/workflows/push_comfyui_ip_adapter.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/speedcy/comfyui-faceid

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository (Cloning Repo)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./comfyui_ip_adapter
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=comfyui_ip_adapter
          cache-to: type=gha,mode=max,scope=comfyui_ip_adapter
    
    
