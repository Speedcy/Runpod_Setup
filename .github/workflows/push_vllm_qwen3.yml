name: Build and Push Docker Image (vllm_qwen3)

on:
  push:
    branches: [main]
    paths:
      - 'vllm_qwen3/**'
      - '.github/workflows/push_vllm_qwen3.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/speedcy/vllm-qwen3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vllm_qwen3
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=vllm_qwen3
          cache-to: type=gha,mode=max,scope=vllm_qwen3
